spring:
  application:
    name: noor-academy-backend
  profiles:
    active: dev
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# Optional SMTP must never block an otherwise healthy API deployment. Database
# health remains enabled. Opt in to SMTP health only after mail is configured.
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-prod-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  enrollment:
    pending-expiry-hours: 72
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      region: ${R2_REGION:auto}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@noor.academy}
