services:
  - type: web
    name: noor-academy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms64m -Xmx256m"
      # Storage stays unavailable until private R2 credentials are added.
      # See backend/.env.example and docs/DEPLOYMENT_FREE_TIER.md.
      - key: R2_REGION
        value: auto
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HEALTH_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_USERNAME
        value: resend
