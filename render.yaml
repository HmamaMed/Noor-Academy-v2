databases:
  - name: noor-academy-db
    plan: free
    databaseName: noor_academy
    user: noor_academy

services:
  - type: web
    name: noor-academy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: noor-academy-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: noor-academy-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: noor-academy-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: noor-academy-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: noor-academy-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200
