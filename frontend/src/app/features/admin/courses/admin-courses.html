<h1 class="text-2xl font-bold text-ink">Courses</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-3 rounded-lg border border-gray-200 bg-white p-4">
  <h2 class="font-semibold text-ink">{{ editingId() ? 'Edit Course' : 'New Course' }}</h2>
  <input
    formControlName="title"
    placeholder="Title"
    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
  />
  <textarea
    formControlName="description"
    placeholder="Description"
    rows="2"
    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
  ></textarea>
  <textarea
    formControlName="syllabus"
    placeholder="Syllabus"
    rows="2"
    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
  ></textarea>
  <div class="flex gap-2">
    <button
      type="submit"
      [disabled]="saving()"
      class="rounded-md bg-primary-500 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-600 disabled:opacity-50"
    >
      {{ editingId() ? 'Save Changes' : 'Create Course' }}
    </button>
    @if (editingId()) {
      <button
        type="button"
        (click)="cancelEdit()"
        class="rounded-md border border-gray-300 px-4 py-2 text-sm font-semibold text-ink hover:bg-gray-50"
      >
        Cancel
      </button>
    }
  </div>
</form>

<div class="mt-6 overflow-x-auto rounded-lg border border-gray-200 bg-white">
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50 text-left text-xs font-semibold uppercase text-gray-500">
      <tr>
        <th class="px-4 py-3">Title</th>
        <th class="px-4 py-3">Description</th>
        <th class="px-4 py-3 text-right">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      @if (loading()) {
        <tr><td colspan="3" class="px-4 py-6 text-center text-gray-400">Loading&hellip;</td></tr>
      } @else {
        @for (course of courses(); track course.id) {
          <tr>
            <td class="px-4 py-3 font-medium text-ink">{{ course.title }}</td>
            <td class="max-w-sm truncate px-4 py-3 text-gray-500">{{ course.description }}</td>
            <td class="px-4 py-3 text-right">
              <button (click)="startEdit(course)" class="mr-2 font-semibold text-primary-500 hover:underline">
                Edit
              </button>
              <button (click)="delete(course)" class="font-semibold text-danger hover:underline">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="3" class="px-4 py-6 text-center text-gray-400">No courses yet.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
