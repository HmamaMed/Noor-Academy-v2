<div class="mx-auto flex max-w-7xl gap-8 px-4 py-8 sm:px-6 lg:px-8">
  <aside class="w-48 shrink-0">
    <nav class="space-y-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-primary-500 text-white"
          class="block rounded-md px-3 py-2 text-sm font-medium text-ink hover:bg-primary-50"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="min-w-0 flex-1">
    <router-outlet />
  </div>
</div>
