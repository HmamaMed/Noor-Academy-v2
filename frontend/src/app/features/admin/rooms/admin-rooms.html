<h1 class="text-2xl font-bold text-ink">Rooms</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex items-end gap-3 rounded-lg border border-gray-200 bg-white p-4">
  <div class="flex-1">
    <label class="block text-sm font-medium text-ink">Name</label>
    <input
      formControlName="name"
      class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
    />
  </div>
  <div class="w-32">
    <label class="block text-sm font-medium text-ink">Capacity</label>
    <input
      type="number"
      min="1"
      formControlName="maxCapacity"
      class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
    />
  </div>
  <button
    type="submit"
    [disabled]="saving()"
    class="rounded-md bg-primary-500 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-600 disabled:opacity-50"
  >
    {{ editingId() ? 'Save Changes' : 'Add Room' }}
  </button>
  @if (editingId()) {
    <button
      type="button"
      (click)="cancelEdit()"
      class="rounded-md border border-gray-300 px-4 py-2 text-sm font-semibold text-ink hover:bg-gray-50"
    >
      Cancel
    </button>
  }
</form>

<div class="mt-6 overflow-x-auto rounded-lg border border-gray-200 bg-white">
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50 text-left text-xs font-semibold uppercase text-gray-500">
      <tr>
        <th class="px-4 py-3">Name</th>
        <th class="px-4 py-3">Capacity</th>
        <th class="px-4 py-3 text-right">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      @if (loading()) {
        <tr><td colspan="3" class="px-4 py-6 text-center text-gray-400">Loading&hellip;</td></tr>
      } @else {
        @for (room of rooms(); track room.id) {
          <tr>
            <td class="px-4 py-3 font-medium text-ink">{{ room.name }}</td>
            <td class="px-4 py-3 text-gray-500">{{ room.maxCapacity }}</td>
            <td class="px-4 py-3 text-right">
              <button (click)="startEdit(room)" class="mr-2 font-semibold text-primary-500 hover:underline">
                Edit
              </button>
              <button (click)="delete(room)" class="font-semibold text-danger hover:underline">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="3" class="px-4 py-6 text-center text-gray-400">No rooms yet.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
