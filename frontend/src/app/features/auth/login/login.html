<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-10">
  <h1 class="text-2xl font-bold text-ink">Welcome back</h1>
  <p class="mt-1 text-sm text-gray-500">Log in to manage your enrollments.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-ink">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-ink">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
      />
    </div>

    @if (errorMessage(); as error) {
      <p class="rounded-md bg-danger/10 px-3 py-2 text-sm text-danger">{{ error }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-md bg-primary-500 px-4 py-2 font-semibold text-white hover:bg-primary-600 disabled:opacity-50"
    >
      {{ loading() ? 'Logging in…' : 'Log In' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    Don't have an account?
    <a routerLink="/register" class="font-semibold text-primary-500 hover:underline">Register</a>
  </p>
</div>
